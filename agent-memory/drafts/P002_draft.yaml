schema_version: 1
id: P002
title: Запуск приложения на сервере
description: 'Пользователь показал: скопировать артефакт, распаковать, перезапустить
  службу, проверить health'
tags:
- deploy
- service
- health
keywords:
- запуск
- приложение
- сервер
- deploy
- health
owner: команда
status: active
parameters: []
steps:
- order: 1
  description: Копируем артефакт на сервер
  command: scp build.tar.gz deploy@server1:/opt/app/
- order: 2
  description: Распаковываем артефакт
  command: ssh deploy@server1 "cd /opt/app && tar xzf build.tar.gz"
- order: 3
  description: Перезапускаем службу
  command: ssh deploy@server1 "systemctl restart app"
- order: 4
  description: Проверяем health-эндпоинт
  command: curl -sf http://server1:8080/health
dependencies: []
criteria: []
timeout_seconds: 600
max_steps: 20
